<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Страница не найдена — Диас Туркенов</title>
<meta name="description" content="Страница не найдена. Перейдите на главную страницу сайта судебного юриста Диаса Туркенова или в раздел «Контакты».">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#ece6da;--ink2:#b4ac9c;--mut:#867f6e;--line:#2a2720;--line2:#3a352c;--bg:#131110;--bg2:#1a1712;--accent:#caa964;--accent2:#e2c585}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.62;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100svh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20% -20% auto auto;width:640px;height:640px;border-radius:50%;
  background:radial-gradient(circle,#4c3c1f,transparent 66%);opacity:.45;filter:blur(90px);pointer-events:none;z-index:0}
a{color:inherit;text-decoration:none}
header,main,footer{position:relative;z-index:1}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px;width:100%}
header{padding:26px 0}
.logo{display:inline-flex;align-items:center;gap:12px;font-family:"Playfair Display",Georgia,serif;font-size:20px;color:var(--ink)}
.logo img{height:32px;width:auto}
main{flex:1;display:flex;align-items:center;padding:40px 0 80px}
.rule{width:52px;height:1px;background:var(--accent);opacity:.85;margin-bottom:26px}
.code{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 18px}
h1{font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:clamp(38px,7vw,76px);line-height:1.06;letter-spacing:-.02em;margin:0 0 18px;max-width:14ch}
.lead{font-size:clamp(16px,1.5vw,18.5px);color:var(--ink2);max-width:540px;margin:0 0 36px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border-radius:3px;font-size:14.5px;font-weight:500;letter-spacing:.01em;transition:background .3s,border-color .3s,color .3s}
.btn-pri{background:var(--accent);color:#120f08}
.btn-pri:hover{background:var(--accent2)}
.btn-ghost{border:1px solid var(--line2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.lang{display:flex;gap:4px;margin-top:44px}
.lang button{background:none;border:1px solid transparent;color:var(--mut);font:inherit;font-size:12px;letter-spacing:.08em;padding:6px 10px;border-radius:3px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--line2)}
footer{padding:28px 0 36px;border-top:1px solid var(--line);color:var(--mut);font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:600px){.wrap{padding:0 16px}header{padding:20px 0}main{padding:24px 0 56px}.btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<header>
  <div class="wrap"><a class="logo" id="homeLogo" href="/website_for_professor/"><img id="mark" src="/website_for_professor/mono-light.png" alt="" width="24" height="32"> Диас Туркенов</a></div>
</header>
<main>
  <div class="wrap">
    <div class="rule" aria-hidden="true"></div>
    <p class="code" id="t_code">Ошибка 404</p>
    <h1 id="t_h1">Такой страницы нет</h1>
    <p class="lead" id="t_lead">Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную или сразу перейдите к контактам.</p>
    <div class="cta">
      <a class="btn btn-pri" id="homeBtn" href="/website_for_professor/"><span id="t_home">На главную</span> <span aria-hidden="true">→</span></a>
      <a class="btn btn-ghost" id="contactBtn" href="/website_for_professor/#contact"><span id="t_contact">Контакты</span></a>
    </div>
    <div class="lang" role="group" aria-label="Язык / Тіл / Language">
      <button type="button" data-l="ru" aria-pressed="true">RU</button>
      <button type="button" data-l="kk" aria-pressed="false">KZ</button>
      <button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
  </div>
</main>
<footer><div class="wrap">© <span id="yr">2026</span> Диас Туркенов · <span id="t_role">Судебный юрист</span></div></footer>
<script>
(function(){
  // Base path: project site on github.io lives under /<repo>/, a custom domain under /
  var base='/';
  if(/\.github\.io$/.test(location.hostname)){var seg=location.pathname.split('/')[1];base=seg?'/'+seg+'/':'/';}
  else if(location.hostname==='localhost'||location.hostname==='127.0.0.1'){base='/';}
  document.getElementById('homeLogo').href=base;
  document.getElementById('homeBtn').href=base;
  document.getElementById('contactBtn').href=base+'#contact';
  document.getElementById('mark').src=base+'mono-light.png';
  var fav=document.createElement('link');fav.rel='icon';fav.type='image/png';fav.href=base+'mono-dark.png';document.head.appendChild(fav);
  document.getElementById('yr').textContent=new Date().getFullYear();

  var T={
    ru:{title:'Страница не найдена — Диас Туркенов',desc:'Страница не найдена. Перейдите на главную страницу сайта судебного юриста Диаса Туркенова или в раздел «Контакты».',
        code:'Ошибка 404',h1:'Такой страницы нет',lead:'Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную или сразу перейдите к контактам.',home:'На главную',contact:'Контакты',role:'Судебный юрист'},
    kk:{title:'Бет табылмады — Диас Туркенов',desc:'Бет табылмады. Сот юристі Диас Туркеновтың сайтының басты бетіне немесе «Байланыс» бөліміне өтіңіз.',
        code:'404 қатесі',h1:'Мұндай бет жоқ',lead:'Сілтеме ескірген немесе мекенжайда қате болуы мүмкін. Басты бетке оралыңыз немесе бірден байланыс бөліміне өтіңіз.',home:'Басты бетке',contact:'Байланыс',role:'Сот юристі'},
    en:{title:'Page not found — Dias Turkenov',desc:'Page not found. Go to the home page of litigation lawyer Dias Turkenov or straight to Contacts.',
        code:'Error 404',h1:'This page doesn’t exist',lead:'The link may be out of date, or the address may contain a typo. Go back to the home page or straight to Contacts.',home:'Home page',contact:'Contacts',role:'Litigation lawyer'}
  };
  function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
  function apply(l){
    if(!T[l])l='ru';var d=T[l];
    document.documentElement.lang=l;document.title=d.title;
    document.querySelector('meta[name="description"]').setAttribute('content',d.desc);
    set('t_code',d.code);set('t_h1',d.h1);set('t_lead',d.lead);set('t_home',d.home);set('t_contact',d.contact);set('t_role',d.role);
    var bs=document.querySelectorAll('.lang button');for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-pressed',bs[i].getAttribute('data-l')===l?'true':'false');
  }
  // Same origin as the main page, so the visitor's chosen language carries over
  var saved='ru';try{saved=localStorage.getItem('dt_lang')||'ru';}catch(e){}
  apply(saved);
  var bs=document.querySelectorAll('.lang button');
  for(var i=0;i<bs.length;i++)bs[i].addEventListener('click',function(){var l=this.getAttribute('data-l');try{localStorage.setItem('dt_lang',l);}catch(e){}apply(l);});
})();
</script>
</body>
</html>
